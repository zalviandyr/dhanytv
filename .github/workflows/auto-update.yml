name: Sync Parent and Update Proxied Playlist

on:
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

permissions:
    contents: write

env:
    UPSTREAM_REPOSITORY: dhasap/dhanytv
    TARGET_BRANCH: experiment

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout experiment branch
              uses: actions/checkout@v4
              with:
                  ref: experiment
                  fetch-depth: 0
                  # PAT with Contents + Workflows write. GITHUB_TOKEN cannot push
                  # commits that touch .github/workflows/ (parent repo edits them).
                  token: ${{ secrets.SYNC_TOKEN }}

            - name: Configure Git identity
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Sync fork main with parent repository
              run: |
                  git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
                  git fetch --no-tags upstream main
                  git fetch --no-tags origin main experiment

                  current_main=$(git rev-parse refs/remotes/origin/main)
                  git push origin "upstream/main:main" --force-with-lease="main:${current_main}"

            - name: Update experiment from parent main
              run: |
                  git fetch --no-tags origin experiment

                  if git merge-base --is-ancestor upstream/main HEAD; then
                    echo "experiment already contains parent main."
                    exit 0
                  fi

                  # Conflicting hunks keep experiment's side; non-conflicting parent
                  # changes are still merged in. Non-zero exit here just means some
                  # conflicts are left for the cleanup below.
                  git merge --no-commit --no-ff -X ours upstream/main || true
                  git rev-parse -q --verify MERGE_HEAD >/dev/null || { echo "merge did not start"; exit 1; }

                  # File-level conflicts (modify/delete) that -X ours can't settle:
                  # keep experiment's version, or drop the file if experiment deleted it.
                  git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' f; do
                    git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" || git rm -q -- "$f"
                  done

                  # This fork has its own workflow at the same path as the parent's;
                  # never let parent hunks leak into it.
                  git checkout HEAD -- .github/workflows/auto-update.yml

                  git commit --no-edit -m "chore: sync parent main into experiment"

            - name: Check stream availability
              run: |
                  python3 -m py_compile update-script/check_streams.py update-script/generate_proxied.py
                  python3 update-script/check_streams.py dhanytv-ott.m3u \
                    --timeout 10 \
                    --workers 16 \
                    --markdown report.md

            - name: Generate proxied playlist
              run: |
                  python3 update-script/generate_proxied.py \
                    --input dhanytv-ott.m3u \
                    --report report.md \
                    --output dhanytv-proxied.m3u
                  test -s dhanytv-proxied.m3u
                  grep -q '^#EXTM3U' dhanytv-proxied.m3u
                  rm -f report.md

            - name: Commit and push experiment updates
              run: |
                  git add -A

                  if git diff --cached --quiet; then
                    echo "No changes to commit."
                    exit 0
                  fi

                  git commit -m "auto-update: sync parent and regenerate proxied playlist"
                  git push origin "HEAD:${TARGET_BRANCH}"
