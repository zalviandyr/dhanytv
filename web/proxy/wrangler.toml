name = "dhanytv-proxy"
main = "worker.js"
compatibility_date = "2024-09-23"

# Origin yang boleh memakai proxy ini (CORS + cek Referer).
# GANTI sesuai domain Pages kamu. Pisahkan dengan koma. Kosongkan = izinkan semua (TIDAK disarankan).
[vars]
ALLOWED_ORIGINS = "https://dhanytv.zukron-alviandy.workers.dev"

# Rate limit per-IP (anti-abuse). Uncomment jika pakai Workers paid plan.
# [[unsafe.bindings]]
# name = "RL"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 600, period = 60 }

# Batasi pemakaian CPU (hanya paid plan).
# [limits]
# cpu_ms = 50
